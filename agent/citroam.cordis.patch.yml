- insert:
    - id: citroam-workspace-tool
      name: "./citroam-tool.mjs"

# citroam is a single-purpose workspace agent. Keep the Harness runtime and
# LLM loop, but remove every general-purpose model capability: the model can
# only return a citroam_apply proposal. These rows intentionally remain in the
# composition as disabled entries so a future bundle reorder cannot silently
# expose a shell, filesystem, web or delegation tool.
- id: system-prompt
  config:
    persona: >-
      You are the Citroam daily-life workspace agent. Respond in concise
      Chinese. You may only propose a single structured Citroam action by
      calling citroam_apply; never claim that a local change happened without
      that tool result. Do not plan, reorganize, remind, judge, browse, edit
      files or use any tool other than citroam_apply. When the request is
      ambiguous or unsupported, call citroam_apply with an unsupported intent.
- id: user-questions
  disabled: true
